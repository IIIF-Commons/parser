name: Release NPM package

on:
  push:
    tags: ["v*"]
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == github.event.repository.default_branch &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'release/next')
    runs-on: ubuntu-latest
    name: Node build
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          package-manager-cache: false

      - uses: pnpm/action-setup@v3
        with:
          version: 11.13.0
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]

      - run: pnpm build
      - run: pnpm run test
      - run: pnpm run lint:pkg
      - run: pnpm run typecheck
      - run: pnpm run test:package-types

  release:
    needs: [build]
    runs-on: ubuntu-latest
    name: Release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: pnpm/action-setup@v3
        with:
          version: 11.13.0
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Publish to npm
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Git tag must match package.json version (v$version)"
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            npm publish --tag next
          else
            npm publish --tag latest
          fi

      - name: Create GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          args=()
          if [[ "$version" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "v$version" --target "$(git rev-parse HEAD)" \
            --title "v$version" --generate-notes "${args[@]}"
